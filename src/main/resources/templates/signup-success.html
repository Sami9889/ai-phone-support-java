<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Signup successful | AI Phone Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body class="auth-page">
<header class="site-header compact-header">
    <div class="container nav">
        <a href="/" class="brand">
            <span class="brand-mark">AI</span>
            <span>Phone Support</span>
        </a>
        <a href="/signup" class="button button-light">Create another</a>
    </div>
</header>

<main class="auth-wrap success-wrap">
    <section class="success-card">
        <div class="success-badge">✓</div>
        <span class="eyebrow">You’re all set</span>
        <h1>Welcome to AI Phone Support</h1>
        <p th:text="${successMessage} ?: 'Your account has been created successfully.'">Your account has been created successfully.</p>
        <div class="client-code-box" th:if="${clientCode != null}">
            <span>Client code</span>
            <strong th:text="${clientCode}">CLIENT-123</strong>
        </div>
        <a href="/" class="button button-primary">Back to home</a>
    </section>
</main>
</body>
</html>
