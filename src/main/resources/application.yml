server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  datasource:
    url: jdbc:h2:mem:ai-phone-support;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

app:
  telemetry:
    enabled: true
    customer-brand-prefix: "Apex"
  telephony:
    default-country-code: US
    area-code: "415"
    local-start: 5000000

logging:
  level:
    org.springframework: INFO
    com.sami9889: DEBUG
