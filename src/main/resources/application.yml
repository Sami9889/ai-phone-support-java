server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  datasource:
    url: jdbc:h2:mem:ai-phone-support;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

app:
  support:
    default-language: en-US
    human-escalation-key: 0

telnyx:
  api-key: ${TELNYX_API_KEY:}
  public-key: ${TELNYX_PUBLIC_KEY:}
  phone-number: ${TELNYX_PHONE_NUMBER:}
  app-url: ${TELNYX_APP_URL:http://localhost:8080}
  number-order-url: ${TELNYX_NUMBER_ORDER_URL:https://api.telnyx.com/v2/phone_numbers}

openai:
  api-key: ${OPENAI_API_KEY:}
